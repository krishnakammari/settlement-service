version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mock-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:mock
    ports:
      - "4000:4000"
    environment:
      - MOCK_PORT=4000

  settlement-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/settlement
      - GATEWAY_URL=http://mock-gateway:4000/capture
    depends_on:
      - mongodb
      - mock-gateway

volumes:
  mongo-data:
